[project]
name = "ml-index-benchmark"
version = "0.1.0"
description = "Benchmarking learned index structures vs classical B-Tree / Hash indexes"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
